name: Ingest jobs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        run: |
          curl --fail --show-error --request POST \
            "${{ secrets.RENDER_API_URL }}/ingest" \
            --header "X-Ingest-Secret: ${{ secrets.INGEST_SECRET }}"
