name: Ingest jobs

on:
  workflow_dispatch: {}
  # schedule disabled until the backend runs on an always-on tier:
  # schedule:
  #   - cron: "0 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_API_URL != '' }}
    steps:
      - name: Call ingest endpoint
        run: |
          curl --fail --show-error --request POST \
            "${{ vars.RENDER_API_URL }}/ingest" \
            --header "X-Ingest-Secret: ${{ secrets.INGEST_SECRET }}"
